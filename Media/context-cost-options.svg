<svg xmlns="http://www.w3.org/2000/svg" width="760" height="890" viewBox="0 0 760 890" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Three context choices for the next phase</title>
  <desc id="desc">Same-agent continuation retains the transcript and may keep a warm prefix. An agent handoff changes active instructions while retaining the full visible transcript, and the cache usually starts again. A fresh chat begins cold but can use only a saved plan and selected task context.</desc>
  <rect width="760" height="890" rx="24" fill="#f7f9fc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="38" y="52" font-size="32" font-weight="700" fill="#17233c">Choose the next context boundary</text>
    <text x="38" y="84" font-size="20" fill="#4d5b75">Continuity and a smaller input are different goals.</text>

    <rect x="50" y="124" width="660" height="202" rx="18" fill="#e9f6ef" stroke="#86bea2" stroke-width="2"/>
    <text x="78" y="166" font-size="26" font-weight="700" fill="#1f6245">Same agent</text>
    <text x="78" y="204" font-size="21" fill="#47745f">Instructions unchanged</text>
    <text x="78" y="238" font-size="21" fill="#47745f">Accumulated conversation and tool traffic retained</text>
    <rect x="78" y="270" width="570" height="18" rx="9" fill="#cad7d0"/>
    <rect x="78" y="270" width="490" height="18" rx="9" fill="#2d7a57"/>
    <text x="678" y="312" text-anchor="end" font-size="18" font-weight="700" fill="#1f6245">prefix may be warm</text>

    <rect x="50" y="346" width="660" height="222" rx="18" fill="#fff1d9" stroke="#d6a957" stroke-width="2"/>
    <text x="78" y="388" font-size="26" font-weight="700" fill="#815412">Custom-agent handoff</text>
    <text x="78" y="426" font-size="21" fill="#82683c">Target instructions replace source-agent instructions</text>
    <text x="78" y="460" font-size="21" fill="#82683c">Complete visible transcript and tool traffic retained</text>
    <rect x="78" y="492" width="570" height="18" rx="9" fill="#e2d4b8"/>
    <rect x="78" y="492" width="490" height="18" rx="9" fill="#c98219"/>
    <text x="678" y="532" text-anchor="end" font-size="18" font-weight="700" fill="#815412">the cache usually starts again</text>

    <rect x="50" y="588" width="660" height="222" rx="18" fill="#e8edff" stroke="#8fa5db" stroke-width="2"/>
    <text x="78" y="630" font-size="26" font-weight="700" fill="#263b76">Fresh chat with a saved plan</text>
    <text x="78" y="668" font-size="21" fill="#4c5d8e">Target instructions start cold</text>
    <text x="78" y="702" font-size="21" fill="#4c5d8e">Only the saved plan and selected task context are supplied</text>
    <rect x="78" y="734" width="570" height="18" rx="9" fill="#cfd7eb"/>
    <rect x="78" y="734" width="190" height="18" rx="9" fill="#3155a6"/>
    <text x="678" y="774" text-anchor="end" font-size="18" font-weight="700" fill="#263b76">cold, but bounded input</text>

    <rect x="50" y="834" width="660" height="36" rx="9" fill="#edf2fa"/>
    <text x="380" y="858" text-anchor="middle" font-size="18" fill="#33425d">Use a saved artefact and fresh chat when a hard phase boundary matters.</text>
  </g>
</svg>
