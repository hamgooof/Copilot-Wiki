<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">How accumulated context can multiply model input across rounds</title>
  <desc id="desc">Four growing model-input bars show a starting input followed by accumulated search, file and test results. A simplified calculation shows one plus two plus three plus four equals ten blocks of processing. After compaction, older detail is represented by a shorter summary. In rounds two to four the carried-forward blocks are hatched: they were sent before and can be cache reads at a lower price if recent, while the newest block is new input at full price. Real usage also depends on caching, compaction, tool output and model pricing.</desc>
  <defs>
    <pattern id="carried" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#ffffff" fill-opacity="0.5"/><line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-width="5"/></pattern>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#f7f9fc"/>
  <text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17233c">Why later rounds can process more context</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#4d5b75">Each round can carry earlier material forward and add something new.</text>
  <text x="60" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#17233c">Effective model input for each round</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="19">
    <text x="60" y="190" font-weight="700" fill="#263b64">Round 1</text>
    <rect x="155" y="160" width="145" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <text x="227" y="190" text-anchor="middle" font-weight="700" fill="#173878">Starting input</text>

    <text x="60" y="260" font-weight="700" fill="#263b64">Round 2</text>
    <rect x="155" y="230" width="145" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <rect x="300" y="230" width="145" height="48" rx="8" fill="#e4f4eb" stroke="#2c7b59" stroke-width="2"/>
    <rect x="155" y="230" width="145" height="48" rx="8" fill="url(#carried)"/>
    <text x="227" y="260" text-anchor="middle" font-weight="700" fill="#173878">Starting input</text>
    <text x="372" y="260" text-anchor="middle" font-weight="700" fill="#185a3d">Search result</text>

    <text x="60" y="330" font-weight="700" fill="#263b64">Round 3</text>
    <rect x="155" y="300" width="145" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <rect x="300" y="300" width="145" height="48" rx="8" fill="#e4f4eb" stroke="#2c7b59" stroke-width="2"/>
    <rect x="445" y="300" width="145" height="48" rx="8" fill="#efe4fb" stroke="#8052ad" stroke-width="2"/>
    <rect x="155" y="300" width="145" height="48" rx="8" fill="url(#carried)"/>
    <rect x="300" y="300" width="145" height="48" rx="8" fill="url(#carried)"/>
    <text x="227" y="330" text-anchor="middle" font-weight="700" fill="#173878">Starting input</text>
    <text x="372" y="330" text-anchor="middle" font-weight="700" fill="#185a3d">Search result</text>
    <text x="517" y="330" text-anchor="middle" font-weight="700" fill="#60338e">File content</text>

    <text x="60" y="400" font-weight="700" fill="#263b64">Round 4</text>
    <rect x="155" y="370" width="145" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <rect x="300" y="370" width="145" height="48" rx="8" fill="#e4f4eb" stroke="#2c7b59" stroke-width="2"/>
    <rect x="445" y="370" width="145" height="48" rx="8" fill="#efe4fb" stroke="#8052ad" stroke-width="2"/>
    <rect x="590" y="370" width="145" height="48" rx="8" fill="#fff0d6" stroke="#9a6416" stroke-width="2"/>
    <rect x="155" y="370" width="145" height="48" rx="8" fill="url(#carried)"/>
    <rect x="300" y="370" width="145" height="48" rx="8" fill="url(#carried)"/>
    <rect x="445" y="370" width="145" height="48" rx="8" fill="url(#carried)"/>
    <text x="227" y="400" text-anchor="middle" font-weight="700" fill="#173878">Starting input</text>
    <text x="372" y="400" text-anchor="middle" font-weight="700" fill="#185a3d">Search result</text>
    <text x="517" y="400" text-anchor="middle" font-weight="700" fill="#60338e">File content</text>
    <text x="662" y="400" text-anchor="middle" font-weight="700" fill="#704709">Test output</text>
  </g>

  <rect x="770" y="140" width="370" height="295" rx="18" fill="#17233c" stroke="#3155a6" stroke-width="2"/>
  <text x="805" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">The compounding effect</text>
  <text x="805" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#dbe5fa">If each round adds one equal block:</text>
  <text x="805" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">1 + 2 + 3 + 4 = 10</text>
  <text x="805" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#dbe5fa">Four rounds process ten blocks</text>
  <text x="805" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#dbe5fa">in this simplified illustration.</text>
  <line x1="805" y1="367" x2="1105" y2="367" stroke="#7185ad" stroke-width="2"/>
  <text x="805" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f6cf86">Context can grow quickly.</text>
  <text x="805" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#f6cf86">Cache reads soften the cost.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <rect x="155" y="446" width="44" height="26" rx="6" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <text x="210" y="465" fill="#17233c"><tspan font-weight="700">New this round:</tspan> full price</text>
    <rect x="445" y="446" width="44" height="26" rx="6" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <rect x="445" y="446" width="44" height="26" rx="6" fill="url(#carried)"/>
    <text x="500" y="465" fill="#17233c"><tspan font-weight="700">Carried forward:</tspan> cheaper cache read if recent</text>
  </g>

  <text x="60" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#17233c">After compaction</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <rect x="250" y="507" width="145" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
    <rect x="395" y="507" width="210" height="48" rx="8" fill="#e5e9f0" stroke="#68758c" stroke-width="2"/>
    <rect x="605" y="507" width="145" height="48" rx="8" fill="#fff0d6" stroke="#9a6416" stroke-width="2"/>
    <text x="322" y="537" text-anchor="middle" font-weight="700" fill="#173878">Starting input</text>
    <text x="500" y="537" text-anchor="middle" font-weight="700" fill="#38465f">Shorter summary</text>
    <text x="677" y="537" text-anchor="middle" font-weight="700" fill="#704709">Recent result</text>
    <text x="775" y="537" fill="#4d5b75">Older detail becomes a summary.</text>
  </g>

  <rect x="60" y="590" width="1080" height="55" rx="12" fill="#edf2fa"/>
  <text x="85" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#17233c">Real usage varies:</text>
  <text x="262" y="624" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4d5b75">caching, compaction, tool output and model pricing all change the result.</text>
</svg>
