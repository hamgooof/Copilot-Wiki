<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How accumulated context can multiply input across rounds</title>
  <desc id="desc">Four growing prompt bars show a starting prompt followed by accumulated search, file and test results. A simplified calculation shows one plus two plus three plus four equals ten block-rounds. A compacted prompt replaces older detail with a shorter summary. A note says real usage depends on caching, compaction, tool output, model pricing and provider implementation.</desc>

  <rect width="1200" height="620" rx="24" fill="#f7f9fc"/>
  <text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17233c">Why later rounds can process more context</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">Each round can carry earlier material forward and add something new.</text>

  <text x="60" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17233c">Effective input for each round</text>

  <text x="60" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#263b64">Round 1</text>
  <rect x="155" y="160" width="130" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
  <text x="220" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#173878">Starting prompt</text>

  <text x="60" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#263b64">Round 2</text>
  <rect x="155" y="230" width="130" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
  <rect x="285" y="230" width="130" height="48" rx="8" fill="#e4f4eb" stroke="#2c7b59" stroke-width="2"/>
  <text x="220" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#173878">Starting prompt</text>
  <text x="350" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#185a3d">Search result</text>

  <text x="60" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#263b64">Round 3</text>
  <rect x="155" y="300" width="130" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
  <rect x="285" y="300" width="130" height="48" rx="8" fill="#e4f4eb" stroke="#2c7b59" stroke-width="2"/>
  <rect x="415" y="300" width="130" height="48" rx="8" fill="#efe4fb" stroke="#8052ad" stroke-width="2"/>
  <text x="220" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#173878">Starting prompt</text>
  <text x="350" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#185a3d">Search result</text>
  <text x="480" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#60338e">File content</text>

  <text x="60" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#263b64">Round 4</text>
  <rect x="155" y="370" width="130" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
  <rect x="285" y="370" width="130" height="48" rx="8" fill="#e4f4eb" stroke="#2c7b59" stroke-width="2"/>
  <rect x="415" y="370" width="130" height="48" rx="8" fill="#efe4fb" stroke="#8052ad" stroke-width="2"/>
  <rect x="545" y="370" width="130" height="48" rx="8" fill="#fff0d6" stroke="#9a6416" stroke-width="2"/>
  <text x="220" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#173878">Starting prompt</text>
  <text x="350" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#185a3d">Search result</text>
  <text x="480" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#60338e">File content</text>
  <text x="610" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#704709">Test output</text>

  <rect x="755" y="140" width="385" height="295" rx="18" fill="#17233c" stroke="#3155a6" stroke-width="2"/>
  <text x="790" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">The compounding effect</text>
  <text x="790" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dbe5fa">If each round adds one equal block:</text>
  <text x="790" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">1 + 2 + 3 + 4 = 10</text>
  <text x="790" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#dbe5fa">Four rounds process ten “block-rounds”</text>
  <text x="790" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#dbe5fa">of input in this simplified example.</text>
  <line x1="790" y1="365" x2="1105" y2="365" stroke="#7185ad" stroke-width="2"/>
  <text x="790" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#f6cf86">That pattern is quadratic-like—not a bill.</text>

  <text x="60" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17233c">After compaction</text>
  <rect x="210" y="452" width="130" height="48" rx="8" fill="#dfe7fb" stroke="#3155a6" stroke-width="2"/>
  <rect x="340" y="452" width="190" height="48" rx="8" fill="#e5e9f0" stroke="#68758c" stroke-width="2"/>
  <rect x="530" y="452" width="130" height="48" rx="8" fill="#fff0d6" stroke="#9a6416" stroke-width="2"/>
  <text x="275" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#173878">Starting prompt</text>
  <text x="435" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#38465f">Shorter summary</text>
  <text x="595" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#704709">Recent result</text>
  <text x="685" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">Older detail is replaced, so some detail may be lost.</text>

  <rect x="60" y="535" width="1080" height="55" rx="12" fill="#edf2fa"/>
  <text x="85" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Real usage varies:</text>
  <text x="225" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">prompt caching, compaction, uneven tool output, model pricing and provider implementation all change the result.</text>
</svg>
