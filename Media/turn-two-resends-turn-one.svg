<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Turn 2 re-sends turn 1</title>
  <desc id="desc">Two stacked model inputs. Turn 1 holds system instructions and tools, your instructions and your first message. Turn 2 holds all of that again, plus the tool calls and results from turn 1, the first reply and your second message. A brace over the repeated part reads: sent again, every call.</desc>
  <rect width="1000" height="430" rx="22" fill="#f7f9fc"/>
  <text x="42" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">Turn 2 re-sends turn 1</text>
  <text x="42" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">The model keeps no memory. The harness sends the whole conversation again on every call.</text>
  <text x="42" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#263b64">Turn 1</text>
  <rect x="130" y="130" width="140" height="50" rx="9" fill="#e8edff" stroke="#3155a6" stroke-width="2"/>
  <text x="200" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#263b76">System + tools</text>
  <rect x="270" y="130" width="115" height="50" rx="9" fill="#e9f6ef" stroke="#2c7b59" stroke-width="2"/>
  <text x="327.5" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6245">Instructions</text>
  <rect x="385" y="130" width="140" height="50" rx="9" fill="#fff1d9" stroke="#9a6416" stroke-width="2"/>
  <text x="455" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#704709">Your message 1</text>
  <text x="42" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#263b64">Turn 2</text>
  <rect x="130" y="290" width="140" height="50" rx="9" fill="#e8edff" stroke="#3155a6" stroke-width="2"/>
  <text x="200" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#263b76">System + tools</text>
  <rect x="270" y="290" width="115" height="50" rx="9" fill="#e9f6ef" stroke="#2c7b59" stroke-width="2"/>
  <text x="327.5" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6245">Instructions</text>
  <rect x="385" y="290" width="140" height="50" rx="9" fill="#fff1d9" stroke="#9a6416" stroke-width="2"/>
  <text x="455" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#704709">Your message 1</text>
  <rect x="525" y="290" width="180" height="50" rx="9" fill="#e9edf2" stroke="#68758c" stroke-width="2"/>
  <text x="615" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#37465b">Tool calls + results</text>
  <rect x="705" y="290" width="90" height="50" rx="9" fill="#f3eaff" stroke="#8052ad" stroke-width="2"/>
  <text x="750" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#653493">Reply 1</text>
  <rect x="795" y="290" width="152" height="50" rx="9" fill="#fff1d9" stroke="#9a6416" stroke-width="2"/>
  <text x="871" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#704709">Your message 2</text>
  <path d="M130 272 q0 -14 14 -14 H448.5 q14 0 14 -14 q0 14 14 14 H781 q14 0 14 14" fill="none" stroke="#3155a6" stroke-width="3"/>
  <rect x="342.5" y="212" width="240" height="32" rx="16" fill="#3155a6"/>
  <text x="462.5" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">sent again, every call</text>
  <text x="871" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a6416">new</text>
  <rect x="42" y="372" width="916" height="34" rx="8" fill="#edf2fa"/>
  <text x="500" y="395" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#33425d">Each round inside a turn re-sends everything too. Caching can make the repeat cheaper, but it is still sent.</text>
</svg>
