<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Example text pieces mapped to token IDs</title>
  <desc id="desc">Pieces from a sentence are shown as coloured tokens. Three example mappings show Hello to 13225, comma to 11 and space tokens to 20290. Another tokenizer may split and number the text differently.</desc>
  <rect width="900" height="340" rx="20" fill="#172033"/>
  <text x="36" y="45" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Text becomes numbered tokens</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d5ea">One tokenizer split this sentence into pieces such as:</text>
  <g font-family="Consolas, Segoe UI, monospace" font-size="18" font-weight="700">
    <rect x="36" y="100" width="68" height="38" rx="7" fill="#e7d9ff"/><text x="70" y="125" text-anchor="middle" fill="#4d2c73">Hello</text><rect x="110" y="100" width="34" height="38" rx="7" fill="#d9f1e5"/><text x="127" y="125" text-anchor="middle" fill="#1f6245">,</text><rect x="150" y="100" width="68" height="38" rx="7" fill="#ffe1e7"/><text x="184" y="125" text-anchor="middle" fill="#7d293c"> hello</text><rect x="224" y="100" width="34" height="38" rx="7" fill="#fff0d6"/><text x="241" y="125" text-anchor="middle" fill="#704709">.</text><rect x="264" y="100" width="62" height="38" rx="7" fill="#dce9ff"/><text x="295" y="125" text-anchor="middle" fill="#263b76"> This</text><rect x="332" y="100" width="135" height="38" rx="7" fill="#e0f2f7"/><text x="399" y="125" text-anchor="middle" fill="#17617a"> presentation</text><rect x="473" y="100" width="72" height="38" rx="7" fill="#e7d9ff"/><text x="509" y="125" text-anchor="middle" fill="#4d2c73"> turns</text><rect x="551" y="100" width="72" height="38" rx="7" fill="#d9f1e5"/><text x="587" y="125" text-anchor="middle" fill="#1f6245"> words</text><rect x="629" y="100" width="60" height="38" rx="7" fill="#ffe1e7"/><text x="659" y="125" text-anchor="middle" fill="#7d293c"> into</text><rect x="695" y="100" width="82" height="38" rx="7" fill="#fff0d6"/><text x="736" y="125" text-anchor="middle" fill="#704709"> tokens</text><rect x="783" y="100" width="34" height="38" rx="7" fill="#dce9ff"/><text x="800" y="125" text-anchor="middle" fill="#263b76">.</text>
  </g>
  <text x="36" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Example token IDs</text>
  <g font-family="Consolas, Segoe UI, monospace"><rect x="36" y="205" width="240" height="58" rx="10" fill="#25314a" stroke="#7d95c5"/><text x="58" y="240" font-size="18" fill="#e7d9ff">Hello</text><text x="135" y="240" font-size="18" fill="#9fb2d5">→</text><text x="175" y="240" font-size="18" font-weight="700" fill="#ffffff">13225</text><rect x="296" y="205" width="210" height="58" rx="10" fill="#25314a" stroke="#7d95c5"/><text x="318" y="240" font-size="18" fill="#d9f1e5">,</text><text x="360" y="240" font-size="18" fill="#9fb2d5">→</text><text x="400" y="240" font-size="18" font-weight="700" fill="#ffffff">11</text><rect x="526" y="205" width="338" height="58" rx="10" fill="#25314a" stroke="#7d95c5"/><text x="548" y="240" font-size="18" fill="#fff0d6"> tokens</text><text x="650" y="240" font-size="18" fill="#9fb2d5">→</text><text x="690" y="240" font-size="18" font-weight="700" fill="#ffffff">20290</text></g>
  <text x="36" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c9d5ea">Another model or tokenizer can choose different pieces and assign different numbers.</text>
</svg>
