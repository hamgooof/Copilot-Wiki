<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Measured next-token probabilities for three short inputs</title>
  <desc id="desc">Three panels. Each shows a short input and the three most likely next tokens with their probabilities, measured with GPT-2. The same word "good" is followed by different predictions depending on the words before it.</desc>
  <rect width="1000" height="470" rx="22" fill="#f7f9fc"/>
  <text x="42" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">The model predicts the next token from everything before it</text>
  <text x="42" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">Three inputs and the three most likely next tokens. Bars share one scale. Measured, not invented.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="104" width="290" height="270" rx="16" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
    <text x="64" y="136" font-size="15" fill="#4d5b75">Input</text>
    <rect x="64" y="146" width="246" height="40" rx="8" fill="#fff4e0" stroke="#d99a2b"/>
    <text x="187" y="172" font-size="18" font-weight="700" fill="#7a5100" text-anchor="middle">It is a good</text>
    <text x="64" y="216" font-size="15" fill="#4d5b75">Most likely next token</text>
    <text x="64" y="246" font-size="15" font-weight="700" fill="#17233c">idea</text>
    <rect x="160" y="228" width="44" height="26" rx="5" fill="#3155a6"/><text x="210" y="246" font-size="15" fill="#17233c">18%</text>
    <text x="64" y="282" font-size="15" font-weight="700" fill="#17233c">thing</text>
    <rect x="160" y="264" width="31" height="26" rx="5" fill="#b9c5dc"/><text x="197" y="282" font-size="15" fill="#17233c">13%</text>
    <text x="64" y="318" font-size="15" font-weight="700" fill="#17233c">time</text>
    <rect x="160" y="300" width="14" height="26" rx="5" fill="#b9c5dc"/><text x="180" y="318" font-size="15" fill="#17233c">6%</text>
    <rect x="355" y="104" width="290" height="270" rx="16" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
    <text x="377" y="136" font-size="15" fill="#4d5b75">Input</text>
    <rect x="377" y="146" width="246" height="40" rx="8" fill="#fff4e0" stroke="#d99a2b"/>
    <text x="500" y="172" font-size="18" font-weight="700" fill="#7a5100" text-anchor="middle">He shouted good</text>
    <text x="377" y="216" font-size="15" fill="#4d5b75">Most likely next token</text>
    <text x="377" y="246" font-size="15" font-weight="700" fill="#17233c">- (good-bye)</text>
    <rect x="473" y="228" width="71" height="26" rx="5" fill="#3155a6"/><text x="550" y="246" font-size="15" fill="#17233c">30%</text>
    <text x="377" y="282" font-size="15" font-weight="700" fill="#17233c">night</text>
    <rect x="473" y="264" width="40" height="26" rx="5" fill="#b9c5dc"/><text x="519" y="282" font-size="15" fill="#17233c">17%</text>
    <text x="377" y="318" font-size="15" font-weight="700" fill="#17233c">morning</text>
    <rect x="473" y="300" width="30" height="26" rx="5" fill="#b9c5dc"/><text x="509" y="318" font-size="15" fill="#17233c">12%</text>
    <rect x="668" y="104" width="290" height="270" rx="16" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
    <text x="690" y="136" font-size="15" fill="#4d5b75">Input</text>
    <rect x="690" y="146" width="246" height="40" rx="8" fill="#fff4e0" stroke="#d99a2b"/>
    <text x="813" y="172" font-size="18" font-weight="700" fill="#7a5100" text-anchor="middle">public static void</text>
    <text x="690" y="216" font-size="15" fill="#4d5b75">Most likely next token</text>
    <text x="690" y="246" font-size="15" font-weight="700" fill="#17233c">main</text>
    <rect x="786" y="228" width="132" height="26" rx="5" fill="#3155a6"/><text x="924" y="246" font-size="15" fill="#17233c">62%</text>
    <text x="690" y="282" font-size="15" font-weight="700" fill="#17233c">Main</text>
    <rect x="786" y="264" width="30" height="26" rx="5" fill="#b9c5dc"/><text x="822" y="282" font-size="15" fill="#17233c">12%</text>
    <text x="690" y="318" font-size="15" font-weight="700" fill="#17233c">set</text>
    <rect x="786" y="300" width="3" height="26" rx="5" fill="#b9c5dc"/><text x="795" y="318" font-size="15" fill="#17233c">1%</text>
    <!-- Footer -->
    <rect x="42" y="394" width="916" height="50" rx="12" fill="#e8edff"/>
    <text x="500" y="414" font-size="15" font-weight="700" fill="#263b76" text-anchor="middle">The same word, "good", gets different predictions because the words before it differ.</text>
    <text x="500" y="434" font-size="14" fill="#4d5b75" text-anchor="middle">Measured with GPT-2 (124M parameters, 2019). Current models give different numbers; the mechanism is the same.</text>
  </g>
</svg>
