<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative context-window usage indicator</title><desc id="desc">A horizontal bar is divided into used context, space reserved for the response and currently available space. Example used-context categories include system, instructions, messages and tool results.</desc>
  <rect width="800" height="330" rx="20" fill="#f7f9fc"/>
  <text x="36" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#17233c">How the context window is allocated</text><text x="36" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">Labels and controls vary by IDE and version.</text>
  <rect x="36" y="110" width="728" height="48" rx="10" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/><path d="M36 120a10 10 0 0 1 10-10h264v48H46a10 10 0 0 1-10-10z" fill="#3155a6"/><rect x="310" y="110" width="145" height="48" fill="#8bb5c4"/><path d="M455 110h299a10 10 0 0 1 10 10v28a10 10 0 0 1-10 10H455z" fill="#e9edf2"/>
  <text x="173" y="141" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Used context</text><text x="382" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173b48">Reserved for</text><text x="382" y="151" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#173b48">response</text><text x="610" y="141" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#37465b">Currently available</text>
  <text x="36" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17233c">Used context might include</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17"><rect x="36" y="222" width="150" height="36" rx="18" fill="#e8edff"/><text x="111" y="245" text-anchor="middle" fill="#263b76">System and tools</text><rect x="198" y="222" width="130" height="36" rx="18" fill="#e9f6ef"/><text x="263" y="245" text-anchor="middle" fill="#1f6245">Instructions</text><rect x="340" y="222" width="125" height="36" rx="18" fill="#f3eaff"/><text x="402" y="245" text-anchor="middle" fill="#653493">Messages</text><rect x="477" y="222" width="135" height="36" rx="18" fill="#fff1d9"/><text x="544" y="245" text-anchor="middle" fill="#815412">Tool results</text></g>
  <text x="36" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">Open the indicator for more detail and, where supported, compaction.</text>
</svg>
