<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">One user turn containing multiple agent-loop rounds</title>
  <desc id="desc">A user message begins a turn. Three rounds assemble context, call the model and execute tools before a final response completes the turn.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14213d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3155a6"/>
    </marker>
  </defs>

  <rect width="1200" height="690" rx="24" fill="#f7f9fc"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17233c">One turn can contain many rounds</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">A turn is what you experience. Rounds are the internal work needed to produce the answer.</text>

  <rect x="45" y="115" width="1110" height="500" rx="24" fill="#ffffff" stroke="#3155a6" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="75" y="96" width="330" height="42" rx="21" fill="#3155a6"/>
  <text x="240" y="123" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">TURN: user message → final response</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="80" y="185" width="190" height="300" rx="18" fill="#fff1d9"/>
    <circle cx="175" cy="245" r="34" fill="#d58a20"/>
    <path d="M158 245h34M175 228v34" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <text x="175" y="305" text-anchor="middle" font-size="20" font-weight="700" fill="#614315">User message</text>
    <text x="175" y="339" text-anchor="middle" font-size="14" fill="#765c34">“Find the failing test,</text>
    <text x="175" y="360" text-anchor="middle" font-size="14" fill="#765c34">fix it and verify.”</text>
    <text x="175" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#614315">Starts the turn</text>

    <rect x="330" y="165" width="210" height="340" rx="18" fill="#e8edff"/>
    <text x="435" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#263b76">Round 1</text>
    <rect x="360" y="230" width="150" height="42" rx="9" fill="#ffffff"/>
    <text x="435" y="256" text-anchor="middle" font-size="14" fill="#263b76">Build prompt</text>
    <path d="M435 278v25" stroke="#3155a6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="360" y="312" width="150" height="42" rx="9" fill="#ffffff"/>
    <text x="435" y="338" text-anchor="middle" font-size="14" fill="#263b76">Call model</text>
    <path d="M435 360v25" stroke="#3155a6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="360" y="394" width="150" height="56" rx="9" fill="#ffffff"/>
    <text x="435" y="418" text-anchor="middle" font-size="14" fill="#263b76">Search tool</text>
    <text x="435" y="438" text-anchor="middle" font-size="12" fill="#62709a">returns file paths</text>

    <rect x="580" y="165" width="210" height="340" rx="18" fill="#e9f6ef"/>
    <text x="685" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#1f6245">Round 2</text>
    <rect x="610" y="230" width="150" height="42" rx="9" fill="#ffffff"/>
    <text x="685" y="256" text-anchor="middle" font-size="14" fill="#1f6245">Rebuild prompt</text>
    <path d="M685 278v25" stroke="#2c7b59" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="610" y="312" width="150" height="42" rx="9" fill="#ffffff"/>
    <text x="685" y="338" text-anchor="middle" font-size="14" fill="#1f6245">Call model</text>
    <path d="M685 360v25" stroke="#2c7b59" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="610" y="394" width="150" height="56" rx="9" fill="#ffffff"/>
    <text x="685" y="418" text-anchor="middle" font-size="14" fill="#1f6245">Edit + test</text>
    <text x="685" y="438" text-anchor="middle" font-size="12" fill="#527764">returns test output</text>

    <rect x="830" y="165" width="210" height="340" rx="18" fill="#f3eaff"/>
    <text x="935" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#653493">Round 3</text>
    <rect x="860" y="230" width="150" height="42" rx="9" fill="#ffffff"/>
    <text x="935" y="256" text-anchor="middle" font-size="14" fill="#653493">Rebuild prompt</text>
    <path d="M935 278v25" stroke="#8052ad" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="860" y="312" width="150" height="42" rx="9" fill="#ffffff"/>
    <text x="935" y="338" text-anchor="middle" font-size="14" fill="#653493">Call model</text>
    <path d="M935 360v25" stroke="#8052ad" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="860" y="394" width="150" height="56" rx="9" fill="#ffffff"/>
    <text x="935" y="418" text-anchor="middle" font-size="14" fill="#653493">No tool call</text>
    <text x="935" y="438" text-anchor="middle" font-size="12" fill="#76568f">final text is ready</text>

    <rect x="1060" y="205" width="70" height="260" rx="18" fill="#17233c"/>
    <text x="1095" y="315" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" transform="rotate(90 1095 315)">FINAL RESPONSE</text>
  </g>

  <path d="M275 335h45" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M545 335h25" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M795 335h25" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1045 335h10" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="60" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Why it matters:</text>
  <text x="195" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">each round can resend accumulated context, generate tokens and add another tool result.</text>
</svg>
