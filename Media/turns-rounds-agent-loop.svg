<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">One user turn containing six agent rounds</title>
  <desc id="desc">A checkout-test request leads to six rounds: find the test command, reproduce the failure, inspect the exact test and implementation, edit the code, verify the fix, then return the final response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3155a6"/>
    </marker>
  </defs>

  <rect width="1200" height="500" rx="24" fill="#f7f9fc"/>
  <text x="50" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">One turn can contain many rounds</text>
  <text x="50" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">You send one message. Copilot may call the model and use tools several times before it replies.</text>

  <rect x="35" y="105" width="1130" height="310" rx="20" fill="#ffffff" stroke="#3155a6" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="65" y="87" width="340" height="40" rx="20" fill="#3155a6"/>
  <text x="235" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">TURN: user message to final response</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(55,145)">
      <rect width="165" height="225" rx="14" fill="#fff1d9" stroke="#d8a14e" stroke-width="2"/>
      <text x="82.5" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#614315">Round 1</text>
      <text x="82.5" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#614315">Find test command</text>
      <line x1="25" y1="92" x2="140" y2="92" stroke="#d8a14e"/>
      <text x="82.5" y="122" text-anchor="middle" font-size="16" fill="#765c34">Read scripts and</text>
      <text x="82.5" y="142" text-anchor="middle" font-size="16" fill="#765c34">test configuration</text>
      <text x="82.5" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#614315">Result</text>
      <text x="82.5" y="205" text-anchor="middle" font-size="16" fill="#765c34">command + scope</text>
    </g>

    <g transform="translate(240,145)">
      <rect width="165" height="225" rx="14" fill="#e8edff" stroke="#7590cf" stroke-width="2"/>
      <text x="82.5" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#263b76">Round 2</text>
      <text x="82.5" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#263b76">Reproduce</text>
      <line x1="25" y1="92" x2="140" y2="92" stroke="#7590cf"/>
      <text x="82.5" y="122" text-anchor="middle" font-size="16" fill="#40578f">Run checkout</text>
      <text x="82.5" y="142" text-anchor="middle" font-size="16" fill="#40578f">tests</text>
      <text x="82.5" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#263b76">Result</text>
      <text x="82.5" y="205" text-anchor="middle" font-size="16" fill="#40578f">failure + path</text>
    </g>

    <g transform="translate(425,145)">
      <rect width="165" height="225" rx="14" fill="#e9f6ef" stroke="#71aa8d" stroke-width="2"/>
      <text x="82.5" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6245">Round 3</text>
      <text x="82.5" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6245">Inspect failure</text>
      <line x1="25" y1="92" x2="140" y2="92" stroke="#71aa8d"/>
      <text x="82.5" y="122" text-anchor="middle" font-size="16" fill="#386f56">Read exact test</text>
      <text x="82.5" y="142" text-anchor="middle" font-size="16" fill="#386f56">and code</text>
      <text x="82.5" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6245">Result</text>
      <text x="82.5" y="205" text-anchor="middle" font-size="16" fill="#386f56">relevant contents</text>
    </g>

    <g transform="translate(610,145)">
      <rect width="165" height="225" rx="14" fill="#f3eaff" stroke="#aa87c9" stroke-width="2"/>
      <text x="82.5" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#653493">Round 4</text>
      <text x="82.5" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#653493">Fix cause</text>
      <line x1="25" y1="92" x2="140" y2="92" stroke="#aa87c9"/>
      <text x="82.5" y="122" text-anchor="middle" font-size="16" fill="#76568f">Edit the</text>
      <text x="82.5" y="142" text-anchor="middle" font-size="16" fill="#76568f">implementation</text>
      <text x="82.5" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#653493">Result</text>
      <text x="82.5" y="205" text-anchor="middle" font-size="16" fill="#76568f">updated file</text>
    </g>

    <g transform="translate(795,145)">
      <rect width="165" height="225" rx="14" fill="#e5f4f7" stroke="#6da7b4" stroke-width="2"/>
      <text x="82.5" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#145a69">Round 5</text>
      <text x="82.5" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#145a69">Verify</text>
      <line x1="25" y1="92" x2="140" y2="92" stroke="#6da7b4"/>
      <text x="82.5" y="122" text-anchor="middle" font-size="16" fill="#356f7b">Run focused</text>
      <text x="82.5" y="142" text-anchor="middle" font-size="16" fill="#356f7b">test again</text>
      <text x="82.5" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#145a69">Result</text>
      <text x="82.5" y="205" text-anchor="middle" font-size="16" fill="#356f7b">passing output</text>
    </g>

    <g transform="translate(980,145)">
      <rect width="165" height="225" rx="14" fill="#e8edf5" stroke="#8794aa" stroke-width="2"/>
      <text x="82.5" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#38465f">Round 6</text>
      <text x="82.5" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#38465f">Conclude</text>
      <line x1="25" y1="92" x2="140" y2="92" stroke="#8794aa"/>
      <text x="82.5" y="122" text-anchor="middle" font-size="16" fill="#4f5c72">Stop using</text>
      <text x="82.5" y="142" text-anchor="middle" font-size="16" fill="#4f5c72">tools</text>
      <rect x="18" y="170" width="129" height="36" rx="18" fill="#17233c"/>
      <text x="82.5" y="193" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Final response</text>
    </g>
  </g>

  <g stroke="#3155a6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M214 258h20"/>
    <path d="M399 258h20"/>
    <path d="M584 258h20"/>
    <path d="M769 258h20"/>
    <path d="M954 258h20"/>
  </g>

  <text x="50" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Why it matters:</text>
  <text x="180" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">each round can carry earlier context forward, add a result and make another model call.</text>
  <text x="50" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">The exact number of rounds varies with the task, available tools and decisions made along the way.</text>
</svg>
