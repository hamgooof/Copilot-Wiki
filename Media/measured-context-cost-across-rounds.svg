<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Input tokens and billed credits across a real 21-round Copilot run</title>
  <desc id="desc">Two aligned bar charts show one successful GPT-5.4 implementation run. The upper chart stacks cached and fresh input tokens for each model call. Input grows from 16.5 thousand to 40.5 thousand tokens. The lower chart shows billed credits for the same calls and labels the action taken after each response. Call 20 spikes to 7.31 credits when fresh input rises to 25.2 thousand tokens; caching recovers on call 21.</desc>

  <rect width="1200" height="720" rx="24" fill="#f7f9fc"/>
  <text x="55" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#17233c">What one 21-round implementation run looked like</text>
  <text x="55" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">The input grew over time, but fresh input, output and cache changes caused the cost spikes.</text>

  <text x="55" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#17233c">Input to each model call</text>
