<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How Copilot assembles context for a model call</title>
  <desc id="desc">Seven categories of context can be assembled into a prompt and sent to a language model. The categories are illustrative and do not show prompt order. The prompt, model output and any supported reasoning tokens share the context-window capacity.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#3155a6"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f7f9fc"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#17233c">What reaches the model?</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">VS Code combines several context sources into the input for a model call.</text>

  <rect x="60" y="125" width="520" height="510" rx="18" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
  <text x="90" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17233c">Assembled prompt (input)</text>
  <text x="90" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#68758c">Categories shown for explanation, not prompt order</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="215" width="460" height="50" rx="10" fill="#e8edff"/>
    <text x="110" y="238" font-size="16" font-weight="700" fill="#263b76">System and tool definitions</text>
    <text x="110" y="256" font-size="15" fill="#4c5d8e">Harness rules, tool descriptions and schemas</text>

    <rect x="90" y="275" width="460" height="50" rx="10" fill="#e9f6ef"/>
    <text x="110" y="298" font-size="16" font-weight="700" fill="#1f6245">Customisations</text>
    <text x="110" y="316" font-size="15" fill="#47745f">Instructions, selected agent and loaded skills</text>

    <rect x="90" y="335" width="460" height="50" rx="10" fill="#fff1d9"/>
    <text x="110" y="358" font-size="16" font-weight="700" fill="#815412">Current user message</text>
    <text x="110" y="376" font-size="15" fill="#82683c">The outcome, scope and constraints you typed</text>

    <rect x="90" y="395" width="460" height="50" rx="10" fill="#f3eaff"/>
    <text x="110" y="418" font-size="16" font-weight="700" fill="#653493">Conversation history</text>
    <text x="110" y="436" font-size="15" fill="#76568f">Earlier user and assistant messages</text>

    <rect x="90" y="455" width="460" height="50" rx="10" fill="#e7f6fb"/>
    <text x="110" y="478" font-size="16" font-weight="700" fill="#17617a">Implicit editor context</text>
    <text x="110" y="496" font-size="15" fill="#3f6b7a">Active file, selection, errors and Git state</text>

    <rect x="90" y="515" width="460" height="50" rx="10" fill="#ffebef"/>
    <text x="110" y="538" font-size="16" font-weight="700" fill="#8a3045">Explicit references</text>
    <text x="110" y="556" font-size="15" fill="#8d5b66">Files, URLs or other context you named</text>

    <rect x="90" y="575" width="460" height="50" rx="10" fill="#e9edf2"/>
    <text x="110" y="598" font-size="16" font-weight="700" fill="#37465b">Tool results from earlier rounds</text>
    <text x="110" y="616" font-size="15" fill="#536074">Search, file and terminal output</text>
  </g>

  <line x1="590" y1="380" x2="705" y2="380" stroke="#3155a6" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="648" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3155a6">sent to model</text>

  <rect x="730" y="225" width="410" height="310" rx="24" fill="#17233c" stroke="#3155a6" stroke-width="2"/>
  <circle cx="935" cy="315" r="58" fill="#3155a6"/>
  <path d="M910 315h50M935 290v50" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <text x="935" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Language model</text>
  <text x="935" y="438" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c8d4ec">Processes the prompt; returns a result</text>

  <rect x="775" y="470" width="150" height="42" rx="21" fill="#e9f6ef"/>
  <text x="850" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f6245">Text response</text>
  <text x="950" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#c8d4ec">and/or</text>
  <rect x="975" y="470" width="125" height="42" rx="21" fill="#fff1d9"/>
  <text x="1037" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#815412">Tool call</text>

  <text x="60" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#17233c">Context-window capacity:</text>
  <text x="260" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4d5b75">input prompt + generated output + any supported reasoning tokens.</text>
</svg>
