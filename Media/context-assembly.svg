<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative input assembled for one model call</title>
  <desc id="desc">Seven possible input categories are shown without implying prompt order. An arrow labelled model input points from the assembled prompt to a language model.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#3155a6"/></marker>
  </defs>
  <rect width="1000" height="610" rx="22" fill="#f7f9fc"/>
  <text x="42" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">What can reach the model?</text>
  <text x="42" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">The harness assembles input for each model call. These categories are not prompt order.</text>
  <rect x="42" y="105" width="510" height="445" rx="17" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
  <text x="68" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17233c">Assembled prompt</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="68" y="160" width="458" height="46" rx="9" fill="#e8edff"/><text x="86" y="181" font-size="16" font-weight="700" fill="#263b76">System instructions and tool definitions</text><text x="86" y="198" font-size="14" fill="#4c5d8e">Harness rules, tool descriptions and schemas</text>
    <rect x="68" y="215" width="458" height="46" rx="9" fill="#e9f6ef"/><text x="86" y="236" font-size="16" font-weight="700" fill="#1f6245">Customisations</text><text x="86" y="253" font-size="14" fill="#47745f">Instructions, selected agent and loaded skills</text>
    <rect x="68" y="270" width="458" height="46" rx="9" fill="#fff1d9"/><text x="86" y="291" font-size="16" font-weight="700" fill="#815412">Current user message</text><text x="86" y="308" font-size="14" fill="#82683c">The outcome, scope and constraints you typed</text>
    <rect x="68" y="325" width="458" height="46" rx="9" fill="#f3eaff"/><text x="86" y="346" font-size="16" font-weight="700" fill="#653493">Conversation history</text><text x="86" y="363" font-size="14" fill="#76568f">Earlier user and assistant messages</text>
    <rect x="68" y="380" width="458" height="46" rx="9" fill="#e7f6fb"/><text x="86" y="401" font-size="16" font-weight="700" fill="#17617a">Editor context</text><text x="86" y="418" font-size="14" fill="#3f6b7a">Active file, selection, errors and Git state</text>
    <rect x="68" y="435" width="458" height="46" rx="9" fill="#ffebef"/><text x="86" y="456" font-size="16" font-weight="700" fill="#8a3045">Explicit references</text><text x="86" y="473" font-size="14" fill="#8d5b66">Files, symbols or other context you named</text>
    <rect x="68" y="490" width="458" height="46" rx="9" fill="#e9edf2"/><text x="86" y="511" font-size="16" font-weight="700" fill="#37465b">Tool results from earlier rounds</text><text x="86" y="528" font-size="14" fill="#536074">Search, file, terminal and editing output</text>
  </g>
  <line x1="570" y1="327" x2="655" y2="327" stroke="#3155a6" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="612" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3155a6">model input</text>
  <rect x="680" y="205" width="278" height="245" rx="22" fill="#17233c" stroke="#3155a6" stroke-width="2"/>
  <circle cx="819" cy="276" r="43" fill="#3155a6"/><path d="M798 276h42M819 255v42" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="819" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Language model</text>
  <text x="819" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dbe5fa">Generates the next output</text>
  <rect x="714" y="398" width="94" height="34" rx="17" fill="#e9f6ef"/><text x="761" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f6245">Text</text>
  <text x="824" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dbe5fa">and/or</text>
  <rect x="859" y="398" width="76" height="34" rx="17" fill="#fff1d9"/><text x="897" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#815412">Tool</text>
  <rect x="42" y="568" width="916" height="28" rx="8" fill="#edf2fa"/><text x="500" y="587" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#33425d">Input, generated output and supported reasoning share the model's context-window capacity.</text>
</svg>
