<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc">
  <title id="title">Repository knowledge routes a task to selected documents</title>
  <desc id="desc">A persistence change moves from a task through a small root index, then selected architecture, rules and process routes. The selected knowledge joins task context before code inspection. Unrelated history remains unloaded.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3155a6"/></marker>
  </defs>
  <rect width="760" height="1030" rx="24" fill="#f7f9fc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="38" y="52" font-size="32" font-weight="700" fill="#17233c">Route to what this task needs</text>
    <text x="38" y="84" font-size="20" fill="#4d5b75">The index is a router, not a reading list.</text>

    <rect x="70" y="125" width="620" height="92" rx="17" fill="#fff1d9" stroke="#d6a957" stroke-width="2"/>
    <text x="98" y="163" font-size="24" font-weight="700" fill="#815412">Task</text>
    <text x="98" y="195" font-size="21" fill="#82683c">Change persistence retry behaviour</text>
    <line x1="380" y1="217" x2="380" y2="258" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="270" width="620" height="112" rx="17" fill="#e8edff" stroke="#8fa5db" stroke-width="2"/>
    <text x="98" y="310" font-size="24" font-weight="700" fill="#263b76">Small root index</text>
    <text x="98" y="343" font-size="20" fill="#4c5d8e">Activity: code change</text>
    <text x="420" y="343" font-size="20" fill="#4c5d8e">Area: back-end persistence</text>
    <line x1="380" y1="382" x2="380" y2="423" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="435" width="620" height="103" rx="17" fill="#f3eaff" stroke="#b89bd5" stroke-width="2"/>
    <text x="98" y="475" font-size="24" font-weight="700" fill="#653493">Architecture route</text>
    <text x="98" y="511" font-size="20" fill="#76568f">Expected behaviour, boundaries and connections</text>
    <line x1="380" y1="538" x2="380" y2="579" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="591" width="620" height="103" rx="17" fill="#e9f6ef" stroke="#86bea2" stroke-width="2"/>
    <text x="98" y="631" font-size="24" font-weight="700" fill="#1f6245">Rules route</text>
    <text x="98" y="667" font-size="20" fill="#47745f">Constraints that change implementation decisions</text>
    <line x1="380" y1="694" x2="380" y2="735" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="747" width="620" height="103" rx="17" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
    <text x="98" y="787" font-size="24" font-weight="700" fill="#17233c">Process route</text>
    <text x="98" y="823" font-size="20" fill="#4d5b75">How this kind of change is verified</text>
    <line x1="380" y1="850" x2="380" y2="891" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="70" y="903" width="620" height="86" rx="17" fill="#17233c"/>
    <text x="98" y="940" font-size="24" font-weight="700" fill="#ffffff">Selected task context</text>
    <text x="98" y="972" font-size="20" fill="#dbe5fa">Then inspect code, configuration and tests</text>

    <rect x="493" y="397" width="197" height="32" rx="8" fill="#e9edf2"/>
    <text x="591" y="420" text-anchor="middle" font-size="17" fill="#6e7888">History: not loaded</text>
  </g>
</svg>
