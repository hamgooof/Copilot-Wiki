<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Observed repository-knowledge routing pilot</title>
  <desc id="desc">The same protected Field Visits feature was implemented from the same React and dotnet repository state. Without a route, the agent made 34 successful reads and 15 model requests before its first edit. With a small pointer, root index and two focused guides, it made 26 successful reads and 11 requests before editing. Both passed 24 of 24 acceptance checks. One routed request had an isolated cache miss; normalising it and both initial requests estimates 3.8 percent lower AIC for the routed condition.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3155a6"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2d7a57"/></marker>
    <marker id="greyArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7f8ca3"/></marker>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f7f9fc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="48" font-size="28" font-weight="700" fill="#17233c">A small route reduced orientation in one matched pilot</text>
    <text x="48" y="77" font-size="17" fill="#4d5b75">Same repository, prompt and Sonnet 4.5 model. Raw request logs and code outcomes were inspected.</text>

    <rect x="48" y="101" width="1104" height="78" rx="14" fill="#17233c"/>
    <text x="75" y="132" font-size="19" font-weight="700" fill="#ffffff">Task: add a protected Field Visits feature</text>
    <text x="75" y="158" font-size="15" fill="#dbe4f2">React route, navigation and styles · .NET clean architecture · EF persistence · validation · weather/image reuse · tests</text>

    <rect x="48" y="208" width="440" height="248" rx="18" fill="#fff7e8" stroke="#d6a957" stroke-width="2"/>
    <text x="74" y="242" font-size="20" font-weight="700" fill="#815412">Without a knowledge route</text>
    <text x="74" y="271" font-size="16" fill="#6f5a36">The agent discovered each boundary from code.</text>
    <g transform="translate(74,296)">
      <rect width="180" height="58" rx="11" fill="#ffffff" stroke="#e2c98d"/>
      <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#815412">34 successful reads</text>
      <text x="90" y="45" text-anchor="middle" font-size="13" fill="#76623e">before the first edit</text>
    </g>
    <g transform="translate(278,296)">
      <rect width="180" height="58" rx="11" fill="#ffffff" stroke="#e2c98d"/>
      <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#815412">15 model requests</text>
      <text x="90" y="45" text-anchor="middle" font-size="13" fill="#76623e">before the first edit</text>
    </g>
    <text x="74" y="385" font-size="14" fill="#6f5a36">Orientation included authorization, entities, controllers,</text>
    <text x="74" y="407" font-size="14" fill="#6f5a36">external services, DI, persistence, React structure and tests.</text>
    <text x="74" y="435" font-size="15" font-weight="700" fill="#815412">30 Sonnet requests · 87 tool calls</text>

    <rect x="520" y="208" width="632" height="248" rx="18" fill="#eaf6ef" stroke="#86bea2" stroke-width="2"/>
    <text x="546" y="242" font-size="20" font-weight="700" fill="#1f6245">With a reviewed route</text>
    <g transform="translate(546,266)">
      <rect width="154" height="68" rx="11" fill="#e8edff" stroke="#8fa5db"/>
      <text x="77" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#263b76">Small pointer</text>
      <text x="77" y="47" text-anchor="middle" font-size="13" fill="#4c5d8e">+ root index</text>
    </g>
    <line x1="700" y1="300" x2="730" y2="300" stroke="#3155a6" stroke-width="3" marker-end="url(#blueArrow)"/>
    <g transform="translate(738,266)">
      <rect width="180" height="68" rx="11" fill="#ffffff" stroke="#86bea2"/>
      <text x="90" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6245">Two focused guides</text>
      <text x="90" y="47" text-anchor="middle" font-size="13" fill="#47745f">front end + back end</text>
    </g>
    <line x1="918" y1="300" x2="948" y2="300" stroke="#2d7a57" stroke-width="3" marker-end="url(#greenArrow)"/>
    <g transform="translate(956,266)">
      <rect width="170" height="68" rx="11" fill="#ffffff" stroke="#86bea2"/>
      <text x="85" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6245">Targeted evidence</text>
      <text x="85" y="47" text-anchor="middle" font-size="13" fill="#47745f">still read from code</text>
    </g>
    <g transform="translate(546,359)">
      <rect width="180" height="58" rx="11" fill="#ffffff" stroke="#86bea2"/>
      <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6245">26 successful reads</text>
      <text x="90" y="45" text-anchor="middle" font-size="13" fill="#47745f">8 fewer before editing</text>
    </g>
    <g transform="translate(750,359)">
      <rect width="180" height="58" rx="11" fill="#ffffff" stroke="#86bea2"/>
      <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6245">11 model requests</text>
      <text x="90" y="45" text-anchor="middle" font-size="13" fill="#47745f">4 fewer before editing</text>
    </g>
    <text x="956" y="382" font-size="15" font-weight="700" fill="#1f6245">28 requests</text>
    <text x="956" y="406" font-size="15" font-weight="700" fill="#1f6245">83 tool calls</text>

    <path d="M270 456 C270 490 420 492 520 514" fill="none" stroke="#7f8ca3" stroke-width="3" marker-end="url(#greyArrow)"/>
    <path d="M836 456 C836 490 720 492 680 514" fill="none" stroke="#2d7a57" stroke-width="3" marker-end="url(#greenArrow)"/>
    <rect x="330" y="514" width="540" height="74" rx="15" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
    <text x="600" y="542" text-anchor="middle" font-size="17" font-weight="700" fill="#17233c">Both implementations passed 24 / 24 checks</text>
    <text x="600" y="568" text-anchor="middle" font-size="14" fill="#4d5b75">The routed result also added stronger API and front-end tests.</text>

    <rect x="48" y="606" width="1104" height="28" rx="9" fill="#edf2fa"/>
    <text x="600" y="626" text-anchor="middle" font-size="14" fill="#33425d">Observed AIC: 83.65 vs 92.55 · cache-normalised estimate: 83.65 vs 80.44 (-3.8%).</text>
  </g>
</svg>
