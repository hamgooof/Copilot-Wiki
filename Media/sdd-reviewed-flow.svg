<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Reviewed Spec-Driven Development flow and context choices</title>
  <desc id="desc">Specification, plan, tasks and implementation flow from left to right, with human review gates after specification and planning. Below, an approved plan can continue through a custom-agent handoff with relevant context or be saved and read by a fresh chat without the planning conversation.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#3155a6"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2d7a57"/></marker>
  </defs>
  <rect width="1000" height="600" rx="22" fill="#f7f9fc"/>
  <text x="42" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">From intent to reviewed implementation</text>
  <text x="42" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">Durable artefacts create review points. The transition into implementation determines the context boundary.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="125" width="172" height="92" rx="16" fill="#e8edff" stroke="#8fa5db" stroke-width="2"/>
    <text x="128" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="#263b76">Specification</text>
    <text x="128" y="190" text-anchor="middle" font-size="15" fill="#4c5d8e">what and why</text>

    <line x1="214" y1="171" x2="256" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="290,128 333,171 290,214 247,171" fill="#fff1d9" stroke="#d6a957" stroke-width="2"/>
    <text x="290" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">Human</text>
    <text x="290" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">review</text>

    <line x1="333" y1="171" x2="372" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="390" y="125" width="152" height="92" rx="16" fill="#f3eaff" stroke="#b89bd5" stroke-width="2"/>
    <text x="466" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="#653493">Plan</text>
    <text x="466" y="190" text-anchor="middle" font-size="15" fill="#76568f">how and risks</text>

    <line x1="542" y1="171" x2="584" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="618,128 661,171 618,214 575,171" fill="#fff1d9" stroke="#d6a957" stroke-width="2"/>
    <text x="618" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">Human</text>
    <text x="618" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">review</text>

    <line x1="661" y1="171" x2="700" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="718" y="125" width="112" height="92" rx="16" fill="#e7f6fb" stroke="#82b8ca" stroke-width="2"/>
    <text x="774" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="#17617a">Tasks</text>
    <text x="774" y="190" text-anchor="middle" font-size="15" fill="#3f6b7a">bounded work</text>

    <line x1="830" y1="171" x2="870" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="888" y="125" width="72" height="92" rx="16" fill="#e9f6ef" stroke="#86bea2" stroke-width="2"/>
    <text x="924" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6245">Build</text>
    <text x="924" y="187" text-anchor="middle" font-size="13" fill="#47745f">and test</text>
  </g>

  <text x="42" y="279" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17233c">After an approved plan, choose the boundary deliberately</text>

  <rect x="42" y="306" width="430" height="206" rx="18" fill="#ffffff" stroke="#8fa5db" stroke-width="2"/>
  <rect x="42" y="306" width="430" height="48" rx="18" fill="#e8edff"/>
  <path d="M42 336 V354 H472 V336" fill="#e8edff"/>
  <text x="66" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#263b76">Custom-agent handoff</text>
  <text x="256" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#3155a6">relevant context</text>
  <rect x="70" y="395" width="132" height="66" rx="13" fill="#f3eaff"/>
  <text x="136" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#653493">Planning agent</text>
  <text x="136" y="443" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#76568f">approved output</text>
  <line x1="202" y1="428" x2="284" y2="428" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="302" y="395" width="140" height="66" rx="13" fill="#e9f6ef"/>
  <text x="372" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f6245">Target agent</text>
  <text x="372" y="443" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#47745f">pre-filled prompt</text>
  <text x="66" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4d5b75">Continuity is useful, but chat output is not a durable plan.</text>

  <rect x="528" y="306" width="430" height="206" rx="18" fill="#ffffff" stroke="#86bea2" stroke-width="2"/>
  <rect x="528" y="306" width="430" height="48" rx="18" fill="#e9f6ef"/>
  <path d="M528 336 V354 H958 V336" fill="#e9f6ef"/>
  <text x="552" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f6245">Saved plan in a fresh chat</text>
  <text x="744" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2d7a57">ordinary input</text>
  <rect x="558" y="395" width="132" height="66" rx="13" fill="#fff1d9"/>
  <text x="624" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#815412">Saved plan</text>
  <text x="624" y="443" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#82683c">durable artefact</text>
  <line x1="690" y1="428" x2="772" y2="428" stroke="#2d7a57" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="790" y="395" width="140" height="66" rx="13" fill="#e7f6fb"/>
  <text x="860" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#17617a">New chat</text>
  <text x="860" y="443" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3f6b7a">clean boundary</text>
  <text x="552" y="489" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4d5b75">The planning conversation is not inherited.</text>

  <rect x="42" y="535" width="916" height="35" rx="9" fill="#edf2fa"/>
  <text x="500" y="558" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#33425d">Neither route guarantees lower cost. Compare quality, corrections, total usage and ability to resume.</text>
</svg>
