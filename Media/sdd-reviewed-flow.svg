<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Reviewed Spec-Driven Development flow</title>
  <desc id="desc">The ticket's requirement and acceptance criteria, plan, tasks and build flow from left to right, with human review gates after the ticket and the plan. A final arrow returns from the build to the ticket: check the result against the acceptance criteria.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#3155a6"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2d7a57"/></marker>
  </defs>
  <rect width="1000" height="320" rx="22" fill="#f7f9fc"/>
  <text x="42" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">From intent to reviewed implementation</text>
  <text x="42" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">Durable artefacts create review points. The ticket's acceptance criteria are also the finish line.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="125" width="172" height="92" rx="16" fill="#e8edff" stroke="#8fa5db" stroke-width="2"/>
    <text x="128" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="#263b76">Ticket</text>
    <text x="128" y="181" text-anchor="middle" font-size="14" fill="#4c5d8e">requirement +</text>
    <text x="128" y="200" text-anchor="middle" font-size="14" fill="#4c5d8e">acceptance criteria</text>

    <line x1="214" y1="171" x2="256" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="290,128 333,171 290,214 247,171" fill="#fff1d9" stroke="#d6a957" stroke-width="2"/>
    <text x="290" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">Human</text>
    <text x="290" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">review</text>

    <line x1="333" y1="171" x2="372" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="390" y="125" width="152" height="92" rx="16" fill="#f3eaff" stroke="#b89bd5" stroke-width="2"/>
    <text x="466" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="#653493">Plan</text>
    <text x="466" y="190" text-anchor="middle" font-size="15" fill="#76568f">how and risks</text>

    <line x1="542" y1="171" x2="584" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <polygon points="618,128 661,171 618,214 575,171" fill="#fff1d9" stroke="#d6a957" stroke-width="2"/>
    <text x="618" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">Human</text>
    <text x="618" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#815412">review</text>

    <line x1="661" y1="171" x2="700" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="718" y="125" width="112" height="92" rx="16" fill="#e7f6fb" stroke="#82b8ca" stroke-width="2"/>
    <text x="774" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="#17617a">Tasks</text>
    <text x="774" y="190" text-anchor="middle" font-size="15" fill="#3f6b7a">bounded work</text>

    <line x1="830" y1="171" x2="870" y2="171" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="888" y="125" width="72" height="92" rx="16" fill="#e9f6ef" stroke="#86bea2" stroke-width="2"/>
    <text x="924" y="163" text-anchor="middle" font-size="16" font-weight="700" fill="#1f6245">Build</text>
    <text x="924" y="187" text-anchor="middle" font-size="13" fill="#47745f">and test</text>
  </g>

  <path d="M924 217 V258 H128 V232" fill="none" stroke="#2d7a57" stroke-width="4" marker-end="url(#greenArrow)"/>
  <rect x="356" y="244" width="340" height="30" rx="9" fill="#f7f9fc"/>
  <text x="526" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f6245">Check against acceptance criteria</text>
</svg>
