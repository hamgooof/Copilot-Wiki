<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="742" viewBox="0 0 1000 742" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Where each customisation enters the model input</title>
  <desc id="desc">The model input stack for one model call, with a tag beside each layer saying when it loads. Repository instructions and skill names and descriptions are sent with every model call. Path instructions load when a matching file is involved. A skill body loads when the skill is selected. A selected custom agent replaces the agent instructions layer. A prompt file becomes your request when you run it. A subagent runs its own separate stack and only its result comes back as a tool result.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#3155a6"/></marker>
  </defs>
  <rect width="1000" height="742" rx="22" fill="#f7f9fc"/>
  <text x="42" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">Where each customisation enters the model input</text>
  <text x="42" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">Every customisation is text placed in a known slot. The tags say when each slot is filled.</text>
  <rect x="42" y="105" width="570" height="517" rx="17" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
  <text x="68" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17233c">Model input for one model call</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="68" y="160" width="520" height="48" rx="9" fill="#e8edff"/><text x="86" y="180" font-size="17" font-weight="700" fill="#263b76">Agent instructions and tools</text><text x="86" y="199" font-size="15" fill="#4c5d8e">Built-in agent, or a selected custom agent</text>
    <line x1="588" y1="184.0" x2="636" y2="184.0" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="636" y="167.0" width="322" height="34" rx="17" fill="#e8edff" stroke="#9fb2e6" stroke-width="1.5"/><text x="797" y="189.5" text-anchor="middle" font-size="15" font-weight="700" fill="#263b76">A selected custom agent replaces this</text>
    <rect x="68" y="216" width="520" height="48" rx="9" fill="#e9f6ef"/><text x="86" y="236" font-size="17" font-weight="700" fill="#1f6245">Repository instructions</text><text x="86" y="255" font-size="15" fill="#47745f">.github/copilot-instructions.md</text>
    <line x1="588" y1="240.0" x2="636" y2="240.0" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="636" y="223.0" width="322" height="34" rx="17" fill="#fff1d9" stroke="#d6a957" stroke-width="1.5"/><text x="797" y="245.5" text-anchor="middle" font-size="15" font-weight="700" fill="#815412">Every model call</text>
    <rect x="68" y="272" width="520" height="48" rx="9" fill="#e9f6ef"/><text x="86" y="292" font-size="17" font-weight="700" fill="#1f6245">Path instructions</text><text x="86" y="311" font-size="15" fill="#47745f">*.instructions.md files with applyTo</text>
    <line x1="588" y1="296.0" x2="636" y2="296.0" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="636" y="279.0" width="322" height="34" rx="17" fill="#e9f6ef" stroke="#8cc5a6" stroke-width="1.5"/><text x="797" y="301.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6245">When a matching file is involved</text>
    <rect x="68" y="328" width="520" height="48" rx="9" fill="#f3eaff"/><text x="86" y="348" font-size="17" font-weight="700" fill="#653493">Skill names and descriptions</text><text x="86" y="367" font-size="15" fill="#76568f">One short entry for each skill</text>
    <line x1="588" y1="352.0" x2="636" y2="352.0" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="636" y="335.0" width="322" height="34" rx="17" fill="#fff1d9" stroke="#d6a957" stroke-width="1.5"/><text x="797" y="357.5" text-anchor="middle" font-size="15" font-weight="700" fill="#815412">Every model call</text>
    <rect x="68" y="384" width="520" height="48" rx="9" fill="#f3eaff"/><text x="86" y="404" font-size="17" font-weight="700" fill="#653493">Skill body</text><text x="86" y="423" font-size="15" fill="#76568f">The selected SKILL.md and what it reads</text>
    <line x1="588" y1="408.0" x2="636" y2="408.0" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="636" y="391.0" width="322" height="34" rx="17" fill="#e9f6ef" stroke="#8cc5a6" stroke-width="1.5"/><text x="797" y="413.5" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6245">When selected</text>
    <rect x="68" y="440" width="520" height="48" rx="9" fill="#fff1d9"/><text x="86" y="460" font-size="17" font-weight="700" fill="#815412">Your request</text><text x="86" y="479" font-size="15" fill="#82683c">What you typed, or a prompt file you ran</text>
    <line x1="588" y1="464.0" x2="636" y2="464.0" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="636" y="447.0" width="322" height="34" rx="17" fill="#e8edff" stroke="#9fb2e6" stroke-width="1.5"/><text x="797" y="469.5" text-anchor="middle" font-size="15" font-weight="700" fill="#263b76">A prompt file becomes this when run</text>
    <rect x="68" y="496" width="520" height="48" rx="9" fill="#e9edf2"/><text x="86" y="516" font-size="17" font-weight="700" fill="#37465b">Conversation history and editor context</text><text x="86" y="535" font-size="15" fill="#536074">Earlier messages, active file, references</text>
    <rect x="68" y="552" width="520" height="48" rx="9" fill="#e9edf2"/><text x="86" y="572" font-size="17" font-weight="700" fill="#37465b">Tool results from earlier rounds</text><text x="86" y="591" font-size="15" fill="#536074">Search, file and terminal output</text>
    <rect x="660" y="526.0" width="298" height="118" rx="14" fill="#ffffff" stroke="#3155a6" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="678" y="548.0" width="54" height="10" rx="3" fill="#cfd8ea"/>
    <rect x="678" y="562.0" width="54" height="10" rx="3" fill="#cfd8ea"/>
    <rect x="678" y="576.0" width="54" height="10" rx="3" fill="#cfd8ea"/>
    <text x="748" y="560.0" font-size="17" font-weight="700" fill="#263b76">Subagent</text>
    <text x="748" y="582.0" font-size="15" fill="#4c5d8e">A separate stack of its own</text>
    <text x="678" y="618.0" font-size="15" font-weight="700" fill="#3155a6">Only its result comes back</text>
    <line x1="660" y1="576.0" x2="596" y2="576.0" stroke="#3155a6" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="42" y="655" width="24" height="20" rx="10" fill="#fff1d9" stroke="#d6a957" stroke-width="1.5"/><text x="76" y="670" fill="#33425d">Paid on every model call</text>
    <rect x="342" y="655" width="24" height="20" rx="10" fill="#e9f6ef" stroke="#8cc5a6" stroke-width="1.5"/><text x="376" y="670" fill="#33425d">Loaded only when needed</text>
    <rect x="642" y="655" width="24" height="20" rx="10" fill="#e8edff" stroke="#9fb2e6" stroke-width="1.5"/><text x="676" y="670" fill="#33425d">Swapped in by your choice</text>
  </g>
  <rect x="42" y="694" width="916" height="28" rx="8" fill="#edf2fa"/><text x="500" y="714" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#33425d">Keep the always-paid slots short: they compete with your task on every model call.</text>
</svg>
