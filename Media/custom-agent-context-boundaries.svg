<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Context boundaries when changing custom agents in VS Code</title>
  <desc id="desc">A normal handoff or direct agent selection replaces the active custom-agent instructions but retains the visible conversation and tool traffic. A fresh chat or slash-clear transition starts with the target instructions and a new user message, and must read any durable plan explicitly.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#3155a6"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#2d7a57"/></marker>
  </defs>
  <rect width="1100" height="650" rx="22" fill="#f7f9fc"/>
  <text x="42" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#17233c">Changing agent is not the same as changing conversation</text>
  <text x="42" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4d5b75">The active instructions are replaced. The context boundary depends on how the next phase starts.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="42" y="118" width="270" height="400" rx="18" fill="#ffffff" stroke="#b9c5dc" stroke-width="2"/>
    <rect x="42" y="118" width="270" height="54" rx="18" fill="#f3eaff"/>
    <path d="M42 150 V172 H312 V150" fill="#f3eaff"/>
    <text x="66" y="152" font-size="20" font-weight="700" fill="#653493">Planning conversation</text>

    <text x="66" y="205" font-size="14" font-weight="700" fill="#653493">SYSTEM PROMPT</text>
    <rect x="66" y="218" width="222" height="57" rx="11" fill="#f3eaff"/>
    <text x="177" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#653493">Base instructions</text>
    <text x="177" y="263" text-anchor="middle" font-size="14" fill="#76568f">+ Planner instructions</text>

    <text x="66" y="312" font-size="14" font-weight="700" fill="#3155a6">CONVERSATION MESSAGES</text>
    <rect x="66" y="325" width="222" height="152" rx="11" fill="#edf2fa"/>
    <text x="82" y="354" font-size="15" fill="#33425d">User: feature intent</text>
    <text x="82" y="382" font-size="15" fill="#33425d">Assistant: plan</text>
    <text x="82" y="410" font-size="15" fill="#33425d">User: refinement</text>
    <text x="82" y="438" font-size="15" fill="#33425d">Assistant: approved plan</text>
    <text x="177" y="500" text-anchor="middle" font-size="13" fill="#6e7888">Agent prose is not a chat turn.</text>

    <line x1="312" y1="278" x2="374" y2="278" stroke="#3155a6" stroke-width="4" marker-end="url(#blueArrow)"/>
    <text x="343" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#3155a6">handoff</text>
    <text x="343" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#3155a6">or selector</text>

    <rect x="390" y="118" width="316" height="400" rx="18" fill="#ffffff" stroke="#8fa5db" stroke-width="2"/>
    <rect x="390" y="118" width="316" height="54" rx="18" fill="#e8edff"/>
    <path d="M390 150 V172 H706 V150" fill="#e8edff"/>
    <text x="414" y="152" font-size="20" font-weight="700" fill="#263b76">Normal phase transition</text>

    <text x="414" y="205" font-size="14" font-weight="700" fill="#653493">SYSTEM PROMPT</text>
    <rect x="414" y="218" width="268" height="57" rx="11" fill="#e8edff"/>
    <text x="548" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#263b76">Base instructions</text>
    <text x="548" y="263" text-anchor="middle" font-size="14" fill="#4c5d8e">+ Implementer instructions</text>

    <text x="414" y="312" font-size="14" font-weight="700" fill="#3155a6">MESSAGES SENT AGAIN</text>
    <rect x="414" y="325" width="268" height="152" rx="11" fill="#edf2fa"/>
    <text x="430" y="353" font-size="15" fill="#33425d">Complete visible planning chat</text>
    <text x="430" y="381" font-size="15" fill="#33425d">+ visible assistant output</text>
    <text x="430" y="409" font-size="15" fill="#33425d">+ tool calls and tool results</text>
    <text x="430" y="437" font-size="15" fill="#33425d">+ new handoff/user prompt</text>
    <text x="548" y="500" text-anchor="middle" font-size="13" fill="#6e7888">Completed-turn reasoning was absent.</text>

    <line x1="706" y1="278" x2="768" y2="278" stroke="#2d7a57" stroke-width="4" marker-end="url(#greenArrow)"/>
    <text x="737" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a57">fresh chat</text>
    <text x="737" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a57">or /clear</text>

    <rect x="784" y="118" width="274" height="400" rx="18" fill="#ffffff" stroke="#86bea2" stroke-width="2"/>
    <rect x="784" y="118" width="274" height="54" rx="18" fill="#e9f6ef"/>
    <path d="M784 150 V172 H1058 V150" fill="#e9f6ef"/>
    <text x="808" y="152" font-size="20" font-weight="700" fill="#1f6245">Clean context boundary</text>

    <text x="808" y="205" font-size="14" font-weight="700" fill="#653493">SYSTEM PROMPT</text>
    <rect x="808" y="218" width="226" height="57" rx="11" fill="#e9f6ef"/>
    <text x="921" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6245">Base instructions</text>
    <text x="921" y="263" text-anchor="middle" font-size="14" fill="#47745f">+ Implementer instructions</text>

    <text x="808" y="312" font-size="14" font-weight="700" fill="#2d7a57">NEW MESSAGE ARRAY</text>
    <rect x="808" y="325" width="226" height="152" rx="11" fill="#edf7f1"/>
    <text x="824" y="354" font-size="15" fill="#33425d">New user request</text>
    <text x="824" y="382" font-size="15" fill="#33425d">+ saved plan if referenced</text>
    <line x1="824" y1="408" x2="1018" y2="408" stroke="#b7c0ce" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="824" y="437" font-size="15" fill="#6e7888">No inherited chat or tools</text>
    <text x="921" y="500" text-anchor="middle" font-size="13" fill="#6e7888">/clear required a separate next send.</text>
  </g>

  <rect x="42" y="548" width="1016" height="67" rx="12" fill="#fff1d9"/>
  <text x="550" y="576" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#815412">Observed on VS Code 1.131.0 with Claude Haiku 4.5</text>
  <text x="550" y="599" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#82683c">Within one tool loop, logged reasoning was reused for the post-tool request; it was removed before the later handoff request.</text>
</svg>
